version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - TIMELY_AI_API_KEY=${TIMELY_AI_API_KEY}
      - HIGGSFIELD_API_KEY=${HIGGSFIELD_API_KEY}
      - HIGGSFIELD_API_SECRET=${HIGGSFIELD_API_SECRET}
    volumes:
      - ./backend:/app/backend
      - ./config.json:/app/config.json
    networks:
      - jejusalt-network
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "5176:80"
    volumes:
      - ./jejusalt-frontend/dist:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - jejusalt-network
    restart: unless-stopped

networks:
  jejusalt-network:
    driver: bridge
